# InBusket フロントエンド CI/CD
# - main への push: lint → tsc → vitest → build → pnpm audit → GitHub Pages デプロイ
# - PR: lint → tsc → vitest のみ（デプロイなし）
# セキュリティ要件:
#   - GITHUB_TOKEN は最小権限（contents:read を既定、デプロイジョブでのみ pages:write / id-token:write）
#   - シークレットは GitHub Secrets / 環境変数経由のみ（コードへのハードコード禁止）
name: front-ci-cd

on:
  push:
    branches: [main]
    paths:
      - "project/front/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "project/front/**"
      - ".github/workflows/deploy.yml"

# 既定権限を最小化（読取のみ）。書込は必要なジョブで個別付与。
permissions:
  contents: read

# 同一参照の重複実行を抑止。デプロイ進行中はキャンセルしない。
concurrency:
  group: front-ci-cd-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: project/front

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"

jobs:
  # ---------------------------------------------------------------------------
  # 検証ジョブ: PR / push 双方で実行（lint / tsc / vitest）
  # ---------------------------------------------------------------------------
  verify:
    name: lint / tsc / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: project/front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript type check
        run: pnpm tsc --noEmit

      - name: Vitest
        run: pnpm vitest run

  # ---------------------------------------------------------------------------
  # ビルド + 監査ジョブ: main push 時のみ
  # ---------------------------------------------------------------------------
  build:
    name: build / audit
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: project/front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # DoD §5-1 に基づき High/Critical 脆弱性ゼロを必須ゲート化。
      - name: pnpm audit (High/Critical をブロック)
        run: pnpm audit --prod --audit-level high

      - name: Build (本番ベース URL 注入)
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/
          # PBI-052 / TASK-202: AdSense クライアントID / スロットID を GitHub Secrets から注入。
          # 未設定時は AdSense スクリプトが index.html に挿入されず、AdSlot コンポーネントも非表示になる。
          VITE_ADSENSE_CLIENT_ID: ${{ secrets.VITE_ADSENSE_CLIENT_ID }}
          VITE_ADSENSE_SLOT_ID: ${{ secrets.VITE_ADSENSE_SLOT_ID }}
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: project/front/dist

  # ---------------------------------------------------------------------------
  # デプロイジョブ: main push 時のみ。Pages 書込権限を限定付与。
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy (GitHub Pages)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
